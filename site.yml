site:
  title: Denis Rozumny
  author: Denis Rozumny
  name: Denis Rozumny
  name_note: "Note: my name can also be spelled Denys Rozumnyi."
  photo: denis.png
  ga_id: G-XXMBYZ9G6R

bio:
  - 'I am a Research Scientist at Meta Reality Labs. My main research interests include dynamic scene reconstruction, generative models, and photorealistic rendering.'
  - 'I finished my PhD at the Computer Vision and Geometry Group, Department of Computer Science, ETH Z&uuml;rich under supervision of <a href="http://people.inf.ethz.ch/pomarc/" target="_blank">Prof. Marc Pollefeys</a>. I also worked closely with <a href="http://people.inf.ethz.ch/moswald/" target="_blank">Prof. Martin Oswald</a>, <a href="https://sites.google.com/view/vittoferrari" target="_blank">Prof. Vittorio Ferrari</a>, and <a href="http://cmp.felk.cvut.cz/~matas" target="_blank">Prof. Jiri Matas</a>.'
  - 'Previously, I was a research intern at <a href="https://research.google/" target="_blank">Google Research</a> with <a href="https://sites.google.com/view/vittoferrari" target="_blank">Prof. Vittorio Ferrari</a> and at <a href="https://about.meta.com/realitylabs/" target="_blank">Meta Reality Labs</a>. Before that, I finished my MSc and BSc degrees from <a href="http://cmp.felk.cvut.cz/~matas" target="_blank">CTU in Prague</a>, <a href="https://cmp.felk.cvut.cz/" target="_blank">Center for Machine Perception</a> under supervision of <a href="http://cmp.felk.cvut.cz/~matas" target="_blank">Prof. Jiri Matas</a>.'
  - 'My research interests are in 3D reconstruction of objects and scenes, video understanding, realistic rendering, object detection, tracking, 6D pose estimation. In particular, I focus on test-time optimization methods to solve those problems.'

