# To add a publication: copy an existing block under `publications:` and edit.
#   image:     thumbnail in images/ (shown always)
#   hover:     optional media in images/ shown on mouse-over (.mp4 -> video,
#              .gif/.png/.jpg -> image). Omit for a static thumbnail.
#   highlight: true -> yellow background row (use for your own key papers)
#   award:     optional red note after the venue (e.g. "(Oral Presentation)")
#   authors:   raw HTML; wrap your own name in <strong>...</strong>
#   links:     ordered list of {text, href}
