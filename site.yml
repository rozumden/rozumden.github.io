    authors: 'Ahan Shabanov, Peter Hedman, Ethan Weber, Zhengqin Li, <strong>Denis Rozumny</strong>, Gael Le Lan, Naina Dhingra, Lei Luo, Andrea Vedaldi, Christian Richardt, Andrea Tagliasacchi, Bo Zhu, Numair Khan'
