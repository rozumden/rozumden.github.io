    url: "https://arxiv.org/abs/2605.26368"
    title: "Unified Panoramic Geometry Estimation via Multi-View Foundation Models"
    authors: 'Vukasin Bozic, Isidora Slavkovic, Dominik Narnhofer, Nando Metzger, <strong>Denis Rozumny</strong>, Konrad Schindler, Nikolai Kalischek'
    venue: arXiv
    year: 2026
    links:
      - {text: arxiv, href: "https://arxiv.org/abs/2605.26368"}
      - {text: paper, href: "https://arxiv.org/pdf/2605.26368"}
      - {text: GitHub, href: "https://github.com/prs-eth/PaGeR"}
    abstract: "We introduce PaGeR, a framework that lifts powerful 3D foundation models built for perspective images to the panorama domain, predicting depth, normals, and sky masks and recovering geometrically consistent 360-degree scenes from a single panoramic image."

